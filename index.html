<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البنكرياس التشريحي الدقيق | بحث علمي مصوَّر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c2b2a;
    --paper:#f3ede1;
    --paper-soft:#faf6ec;
    --teal:#1f7a70;
    --teal-dark:#134f49;
    --teal-light:#5fb8ac;
    --coral:#e0623f;
    --gold:#c99a3f;
    --line:#d9cfb8;
    --shadow: 0 20px 40px -20px rgba(19,79,73,0.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(31,122,112,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(224,98,63,0.08), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    line-height:1.9;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(12,43,42,0.045) 1px, transparent 1px);
    background-size:3px 3px;
    pointer-events:none;
    z-index:0;
  }

  .molecules{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .molecules svg{position:absolute; opacity:0.09;}
  .m1{top:6%; right:4%; width:90px; animation:drift1 22s ease-in-out infinite;}
  .m2{top:38%; left:2%; width:60px; animation:drift2 26s ease-in-out infinite;}
  .m3{bottom:12%; right:8%; width:70px; animation:drift1 19s ease-in-out infinite reverse;}
  .m4{top:66%; left:6%; width:50px; animation:drift2 30s ease-in-out infinite;}
  .m5{top:82%; right:28%; width:55px; animation:drift1 24s ease-in-out infinite;}
  .m6{top:22%; right:32%; width:46px; animation:drift2 20s ease-in-out infinite;}
  .m7{top:52%; right:14%; width:60px; animation:drift1 27s ease-in-out infinite;}
  .m8{top:92%; left:22%; width:50px; animation:drift2 23s ease-in-out infinite;}
  .m9{top:14%; left:18%; width:38px; animation:drift1 18s ease-in-out infinite;}
  .m10{top:72%; right:44%; width:44px; animation:drift2 25s ease-in-out infinite;}
  .m11{top:46%; right:6%; width:34px; animation:drift1 21s ease-in-out infinite reverse;}
  .m12{bottom:4%; left:36%; width:40px; animation:drift2 28s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-30px) rotate(15deg);}}
  @keyframes drift2{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(24px) rotate(-12deg);}}

  .blob-deco{position:fixed; border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none;}
  .blob1{width:420px; height:420px; top:-120px; left:-140px; background:radial-gradient(circle, rgba(31,122,112,0.16), transparent 70%);}
  .blob2{width:380px; height:380px; bottom:-100px; right:-120px; background:radial-gradient(circle, rgba(224,98,63,0.14), transparent 70%);}
  .blob3{width:300px; height:300px; top:45%; left:44%; background:radial-gradient(circle, rgba(201,154,63,0.10), transparent 70%);}

  /* ===== SIDE DOT NAV ===== */
  .dotnav{position:fixed; top:50%; left:22px; transform:translateY(-50%); z-index:60; display:flex; flex-direction:column; gap:13px;}
  @media(max-width:980px){ .dotnav{display:none;} }
  .dotnav a{width:9px; height:9px; border-radius:50%; background:rgba(19,79,73,0.22); display:block; position:relative; transition:.3s; text-decoration:none;}
  .dotnav a::before{content:attr(data-label); position:absolute; right:20px; top:50%; transform:translateY(-50%); background:var(--teal-dark); color:#fff; font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:100px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; transform-origin:right;}
  .dotnav a:hover::before{opacity:1;}
  .dotnav a.active{background:var(--coral); transform:scale(1.6);}

  .progress{position:fixed; top:0; right:0; left:0; height:4px; z-index:999;}
  .progress-fill{height:100%; width:0%; background:linear-gradient(to left, var(--coral), var(--gold)); transition:width .1s linear;}

  .wrap{max-width:1060px; margin:0 auto; padding:0 28px 80px; position:relative; z-index:1;}

  [data-reveal]{opacity:0; transform:translateY(36px); transition:opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);}
  [data-reveal].in{opacity:1; transform:translateY(0);}
  [data-reveal="right"]{transform:translateX(50px);}
  [data-reveal="right"].in{transform:translateX(0);}
  [data-reveal="left"]{transform:translateX(-50px);}
  [data-reveal="left"].in{transform:translateX(0);}
  [data-reveal="scale"]{transform:scale(.9);}
